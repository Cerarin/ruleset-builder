# 核心流程：collections（集合源） -> rulesets.sources（组合） -> exclude（剔除） -> output（list/mrs）

collections:

  fakeip-filter:
    url: https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.list
    type: list

  # Infrastructure
  github:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.yaml
    type: yaml

  microsoft:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.yaml
    type: yaml


  # AI
  openai:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.yaml
    type: yaml
  
  google-gemini:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google-gemini.yaml
    type: yaml
  
  anthropic:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/anthropic.yaml
    type: yaml
  xai:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/xai.yaml
    type: yaml

  perplexity:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/perplexity.yaml
    type: yaml

  github-copilot:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github-copilot.yaml
    type: yaml

  cursor:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cursor.yaml
    type: yaml
  
  metaai:
    url: https://github.com/liandu2024/clash/raw/refs/heads/main/list/MetaAi.list
    type: list


  # Games
  game-download-cn:
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Game/GameDownloadCN/GameDownloadCN.yaml
    type: yaml

  steam@cn:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam@cn.mrs
    type: mrs

  category-games-cn:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-games-cn.mrs
    type: mrs


  # IP Collections
  geoip-cn:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.yaml
    type: yaml

  geoip-private:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.yaml
    type: yaml

  geoip-telegram:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.yaml
    type: yaml

  geoip-netflix:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/netflix.yaml
    type: yaml

  geoip-google:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/google.yaml
    type: yaml

rulesets:
  cnip:
    behavior: ipcidr
    output:
      - mrs
      - srs
    sources:
      - ref: geoip-cn

  private:
    behavior: ipcidr
    output:
      - mrs
      - srs
    sources:
      - ref: geoip-private

  telegram-ip:
    behavior: ipcidr
    output:
      - mrs
      - srs
    sources:
      - ref: geoip-telegram

  netflix-ip:
    behavior: ipcidr
    output:
      - mrs
      - srs
    sources:
      - ref: geoip-netflix

  google-ip:
    behavior: ipcidr
    output:
      - mrs
      - srs
    sources:
      - ref: geoip-google

  fakeip-filter:
    behavior: domain
    output:
      - mrs
      - srs
    sources:
      - ref: fakeip-filter

  games-cn:
    behavior: domain
    output:
      - mrs
      - srs
    sources:
      - ref: game-download-cn
      - ref: steam@cn
      - ref: category-games-cn
      - inline:
          - DOMAIN-SUFFIX,steamcontent.com
          - DOMAIN-SUFFIX,steamserver.net

  microsoft:
    behavior: domain
    output:
      - mrs
      - srs
    sources:
      - ref: microsoft
    exclude:
      - ref: github
  ai:
    behavior: domain
    output:
      - mrs
      - srs
    sources:
      - ref: anthropic
      - ref: openai
      - ref: google-gemini
      - ref: xai
      - ref: perplexity
      - ref: github-copilot
      - ref: cursor
      - ref: metaai
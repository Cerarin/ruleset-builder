# 核心流程：collections（集合源） -> rulesets.sources（组合） -> exclude（剔除） -> output（list/mrs）

collections:

  # Infrastructure
  github:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.yaml
    type: yaml

  microsoft:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.yaml
    type: yaml


  # AI
  openai:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.yaml
    type: yaml
  
  google-gemini:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google-gemini.yaml
    type: yaml
  
  anthropic:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/anthropic.yaml
    type: yaml
  xai:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/xai.yaml
    type: yaml

  perplexity:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/perplexity.yaml
    type: yaml

  github-copilot:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github-copilot.yaml
    type: yaml

  cursor:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cursor.yaml
    type: yaml
  
  metaai:
    url: https://github.com/liandu2024/clash/raw/refs/heads/main/list/MetaAi.list
    type: list


  # Games
  game-download-cn:
    url: https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Game/GameDownloadCN/GameDownloadCN.yaml
    type: yaml

  steam@cn:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam@cn.mrs
    type: mrs

  category-games-cn:
    url: https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-games-cn.mrs
    type: mrs

rulesets:
  games-cn:
    behavior: domain
    output: mrs
    sources:
      - ref: game-download-cn
      - ref: steam@cn
      - ref: category-games-cn
      - inline:
          - DOMAIN-SUFFIX,steamcontent.com
          - DOMAIN-SUFFIX,steamserver.net

  microsoft:
    behavior: domain
    output: mrs
    sources:
      - ref: microsoft
    exclude:
      - ref: github
  ai:
    behavior: domain
    output: mrs
    sources:
      - ref: anthropic
      - ref: openai
      - ref: google-gemini
      - ref: xai
      - ref: perplexity
      - ref: github-copilot
      - ref: cursor
      - ref: metaai
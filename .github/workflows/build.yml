name: Build rulesets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MIHOMO_VERSION: v1.19.30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install --disable-pip-version-check pyyaml

      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo version

      - name: Build rulesets
        run: python scripts/build.py --mihomo /tmp/mihomo

      - name: Commit generated rulesets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruleset/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: update rulesets"
            git push
          fi
